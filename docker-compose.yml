services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: apniyatra-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-apniyatra_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-apniyatra_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - apniyatra-net

  # FastAPI Backend Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: apniyatra-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-apniyatra_db}
      - SECRET_KEY=${SECRET_KEY:-apniyatra-super-secret-key-change-in-production-2026}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - CORS_ORIGINS=["http://localhost:3000","http://127.0.0.1:3000","https://apniyatra.vercel.app"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - apniyatra-net

  # Next.js Frontend Service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: apniyatra-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    depends_on:
      - backend
    networks:
      - apniyatra-net

volumes:
  postgres_data:
    driver: local

networks:
  apniyatra-net:
    driver: bridge
