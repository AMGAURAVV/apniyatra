# Render Blueprint Infrastructure Specification for ApniYatra
# https://render.com/docs/blueprint-spec

version: "1"

services:
  # 1. FastAPI Backend Web Service
  - type: web
    name: apniyatra-backend
    env: python
    region: oregon
    plan: free
    branch: main
    rootDir: backend
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: apniyatra-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: CORS_ORIGINS
        value: '["https://apniyatra.vercel.app","http://localhost:3000"]'

databases:
  # 2. Managed PostgreSQL Instance
  - name: apniyatra-db
    databaseName: apniyatra_db
    user: apniyatra_user
    region: oregon
    plan: free
    ipAllowList: [] # Open to all Render internal services
